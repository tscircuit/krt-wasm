# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: bun install

      - name: Verify published package layout and embedded router
        run: |
          package_dir=$(mktemp -d)
          archive=$(npm pack --silent --pack-destination "$package_dir")
          tar -xzf "$package_dir/$archive" -C "$package_dir"
          node scripts/check-packed-router.mjs "$package_dir/package"
